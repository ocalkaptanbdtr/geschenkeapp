<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find the Different One 🐾</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fffafc;
      margin: 30px;
    }

    #lives {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: auto;
    }

    .grid img {
      width: 100%;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .grid img:hover {
      transform: scale(1.05);
    }

    #popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #popup img {
      max-width: 80%;
      border-radius: 20px;
    }

    #final {
      display: none;
      margin-top: 40px;
    }

    #final img {
      max-width: 80%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>🐶 Find the Different One</h1>
  <p>Only the best köpekska can find it 👀</p>
  <div id="lives">❌ Mistakes left: <span id="mistakes">3</span></div>

  <div class="grid" id="grid"></div>

  <!-- WRONG POPUP -->
  <div id="popup">
    <img src="https://media.giphy.com/media/3og0IPxMM0erATueVW/giphy.gif">
  </div>

  <!-- FINAL SURPRISE -->
  <div id="final">
    <h2>🎉 You did it! 🎉</h2>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
    <p>
      <a href="https://www.ruhrtopcard.de/karte-hinzufuegen?data=F62403EB-EDED-467A-A81A-C9AA31935CC3" target="_blank">
        Click here for your gift 🎁
      </a>
    </p>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const popup = document.getElementById("popup");
    const mistakesEl = document.getElementById("mistakes");
    const final = document.getElementById("final");

    let mistakes = 0;
    const maxMistakes = 3;

    // RANDOM IMAGE SEEDS
    const sameSeed = Math.floor(Math.random() * 1000);
    const differentSeed = Math.floor(Math.random() * 1000) + 1000;

    const sameImage = `https://picsum.photos/seed/${sameSeed}/200`;
    const differentImage = `https://picsum.photos/seed/${differentSeed}/200`;

    const correctIndex = Math.floor(Math.random() * 16);

    for (let i = 0; i < 16; i++) {
      const img = document.createElement("img");
      img.src = i === correctIndex ? differentImage : sameImage;

      img.onclick = () => {
        if (i === correctIndex) {
          showFinal();
        } else {
          handleWrong();
        }
      };

      grid.appendChild(img);
    }

    function handleWrong() {
      mistakes++;
      mistakesEl.textContent = maxMistakes - mistakes;

      popup.style.display = "flex";

      setTimeout(() => {
        popup.style.display = "none";
        if (mistakes >= maxMistakes) endGame();
      }, 2000);
    }

    function showFinal() {
      grid.style.display = "none";
      document.getElementById("lives").style.display = "none";
      final.style.display = "block";
    }

    function endGame() {
      document.body.innerHTML = `
        <h1>💔 Game Over</h1>
        <p>You ran out of chances… but still cutest köpekska 🐾💗</p>
        <img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif"
             style="max-width:80%; border-radius:20px;">
      `;
    }
  </script>

</body>
</html>
